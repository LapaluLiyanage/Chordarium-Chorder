# Render Blueprint: the API, the analysis worker and the database.
# The web client lives on Vercel (client/vercel.json). Steps: docs/deploy-render-vercel.md
databases:
  - name: chordarium-db
    plan: basic-256mb
    databaseName: chordarium
    user: chordarium

services:
  # The HTTP API. It never touches audio, so a small instance is enough.
  - type: web
    name: chordarium-api
    runtime: docker
    dockerfilePath: ./Dockerfile.server
    dockerContext: .
    plan: starter
    healthCheckPath: /api/songs
    envVars:
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        fromDatabase:
          name: chordarium-db
          property: connectionString
      - key: CHORDARIUM_PDF_OWNER
        value: Chordarium

  # The analysis worker: downloads audio and runs the models, so it needs real memory.
  # standard (2 GB) is enough for Quick mode; Accurate mode (stem separation) needs pro (4 GB+).
  - type: worker
    name: chordarium-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.server
    dockerContext: .
    dockerCommand: python -m server.worker
    plan: standard
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chordarium-db
          property: connectionString
      - key: CHORDARIUM_DATA
        value: /tmp/chordarium
