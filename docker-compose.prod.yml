# Runs the whole app on one machine you control (private use).
#   cp .env.example .env     # then set POSTGRES_PASSWORD
#   docker compose -f docker-compose.prod.yml up -d --build
# The web app is then at http://127.0.0.1:8080 (see docs/deploy.md).
name: chordarium-prod

x-server: &server
  build:
    context: .
    dockerfile: Dockerfile.server
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql://chordarium:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/chordarium
    CHORDARIUM_DATA: /data
    CHORDARIUM_PDF_OWNER: ${CHORDARIUM_PDF_OWNER:-Chordarium}
  volumes:
    - chordarium-data:/data
    - torch-cache:/root/.cache/torch
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chordarium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: chordarium
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chordarium -d chordarium"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *server
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 120 "server.app:create_app()"

  worker:
    <<: *server
    command: python -m server.worker

  web:
    build: ./client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # 127.0.0.1 keeps it private to this machine; set WEB_BIND=0.0.0.0 to reach it from your network
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"

volumes:
  postgres-data:
  chordarium-data:
  torch-cache:
